name: coach-clock

services:
  postgres:
    image: postgres:16
    container_name: coach-clock-postgres
    restart: unless-stopped
    ports:
      # 5434 utåt för att inte krocka med fc-apps 5433.
      - '5434:5432'
    environment:
      # Endast lokal utveckling. Riktiga uppgifter kommer ur miljön, aldrig ur den här filen.
      POSTGRES_USER: ${POSTGRES_USER:-coach_clock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coach_clock}
      POSTGRES_DB: ${POSTGRES_DB:-coach_clock}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-coach_clock} -d ${POSTGRES_DB:-coach_clock}']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
